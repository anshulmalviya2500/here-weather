<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Fixed Background (Stays put while you scroll) -->
    <div class="background-gradient"></div> 

    <!-- Scrollable Content Wrapper -->
    <div class="main-wrapper">
        <div class="weather-container">
            <h1 class="app-title">Weather Forecast</h1>
            
            <div class="search-area">
                <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>

            <div id="weather-display" class="weather-display hide">
                <div class="main-info">
                    <i id="weather-icon" class="weather-icon"></i>
                    <h2 id="temperature">--°C</h2>
                    <p id="city-name">City Name</p>
                    <p id="description">Description</p>
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <div>
                            <span id="humidity">--%</span>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <div>
                            <span id="wind-speed">-- km/h</span>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress-alt"></i>
                        <div>
                            <span id="pressure">---- mb</span>
                            <p>Pressure</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-eye"></i>
                        <div>
                            <span id="visibility">-- km</span>
                            <p>Visibility</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="message" class="message">
                Enter a city to get started!
            </div>
        </div>
        
        <!-- Footer to ensure space at bottom -->
        <footer style="color: rgba(255,255,255,0.5); margin-top: 20px; font-size: 0.8rem;">
            Designed for GitHub Portfolio
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
